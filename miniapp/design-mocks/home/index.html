<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>HabitHero — Dashboard</title>
  <link rel="preconnect" href="https://rsms.me/" />
  <link rel="stylesheet" href="https://rsms.me/inter/inter.css" />

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

  <style>
    :root {
      --bg: #07070b;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Inter", system-ui, Roboto, sans-serif;
      font-feature-settings: "cv11", "ss01";
    }
    html, body {
      margin: 0; padding: 0; min-height: 100%;
      background: radial-gradient(ellipse 80% 60% at 50% 0%, #14101e 0%, #07070b 60%);
      color: white;
      -webkit-font-smoothing: antialiased;
      overflow-x: hidden;
    }
    body {
      display: flex; justify-content: center; align-items: flex-start;
      padding: 40px 16px;
      min-height: 100vh;
    }
    /* Stage for the phone */
    .stage {
      display: flex; justify-content: center;
      perspective: 1400px;
    }
    /* glow under device */
    .stage::before {
      content: ''; position: absolute; z-index: 0;
      width: 520px; height: 520px;
      background: radial-gradient(circle, rgba(139,92,246,0.10), transparent 60%);
      filter: blur(60px);
      pointer-events: none;
      margin-top: 200px;
    }
    button { font-family: inherit; }
    *::-webkit-scrollbar { width: 0; height: 0; }
  </style>
</head>
<body>
  <div class="stage">
    <div id="root"></div>
  </div>

  <script type="text/babel" src="ios-frame.jsx?v=2"></script>
  <script type="text/babel" src="icons.jsx?v=2"></script>
  <script type="text/babel" src="app.jsx?v=2"></script>

  <script type="text/babel" data-presets="react">
    function App() {
      // Device sized 480 wide, 1040 tall, dark
      return (
        <IOSDevice width={480} height={1080} dark={true}>
          {/* Spacer to clear the absolute status bar */}
          <div style={{ height: 62 }} />
          <Dashboard />
        </IOSDevice>
      );
    }
    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
