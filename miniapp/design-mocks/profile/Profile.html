<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Habitrack · Профиль</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<style>
  html, body { background: #07070b; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
    color: #fff;
  }
  .tnum { font-variant-numeric: tabular-nums; font-feature-settings: "tnum"; }

  /* Phone frame */
  .phone {
    width: 480px;
    height: 940px;
    border-radius: 56px;
    background: #000;
    padding: 14px;
    box-shadow:
      0 0 0 2px #1a1a22 inset,
      0 0 0 12px #0d0d12,
      0 40px 80px -20px rgba(139, 92, 246, 0.18),
      0 30px 60px -30px rgba(0,0,0,0.7);
    position: relative;
  }
  .phone::before {
    content: "";
    position: absolute;
    top: 24px; left: 50%; transform: translateX(-50%);
    width: 130px; height: 34px;
    background: #000;
    border-radius: 20px;
    z-index: 30;
  }
  .screen {
    width: 100%; height: 100%;
    border-radius: 44px;
    background: #0A0A0F;
    overflow: hidden;
    position: relative;
  }
  .scroll {
    position: absolute; inset: 0;
    overflow-y: auto;
    scrollbar-width: none;
  }
  .scroll::-webkit-scrollbar { display: none; }

  /* Subtle inner glow on hero */
  .hero-glow {
    background:
      radial-gradient(120% 80% at 100% 0%, rgba(255,255,255,0.18) 0%, rgba(255,255,255,0) 55%),
      radial-gradient(80% 100% at 0% 100%, rgba(0,0,0,0.25) 0%, rgba(0,0,0,0) 60%),
      linear-gradient(135deg, #8B5CF6 0%, #6366F1 100%);
  }

  /* Achievement tile gold gradient (unlocked) */
  .ach-unlocked {
    background:
      radial-gradient(120% 100% at 50% 0%, rgba(245, 158, 11, 0.22) 0%, rgba(245, 158, 11, 0.08) 60%, rgba(245, 158, 11, 0.05) 100%);
    border: 1px solid rgba(245, 158, 11, 0.28);
  }
  .ach-locked {
    background: #1F1F2A;
    border: 1px solid rgba(255,255,255,0.04);
  }

  /* Hairline divider */
  .hairline { background: linear-gradient(to right, transparent, rgba(255,255,255,0.06), transparent); height: 1px; }

  /* Tap feedback */
  .tap { transition: background 160ms ease, transform 160ms ease; }
  .tap:active { transform: scale(0.985); }
  .row-tap:hover { background: #20202c; }

  /* iOS switch */
  .ios-switch {
    width: 46px; height: 28px; border-radius: 999px;
    background: #2a2a36; position: relative;
    transition: background 200ms ease;
    cursor: pointer;
    box-shadow: inset 0 0 0 1px rgba(255,255,255,0.04);
  }
  .ios-switch[data-on="true"] {
    background: linear-gradient(135deg, #8B5CF6 0%, #6366F1 100%);
    box-shadow: 0 0 0 1px rgba(139, 92, 246, 0.4), 0 4px 10px -2px rgba(139,92,246,0.45);
  }
  .ios-switch .knob {
    position: absolute; top: 2px; left: 2px;
    width: 24px; height: 24px; border-radius: 999px;
    background: #fff;
    box-shadow: 0 1px 2px rgba(0,0,0,0.35);
    transition: transform 200ms cubic-bezier(.4,1.4,.6,1);
  }
  .ios-switch[data-on="true"] .knob { transform: translateX(18px); }

  /* Segmented control */
  .seg {
    background: #14141c;
    border-radius: 10px;
    padding: 3px;
    display: inline-flex;
    box-shadow: inset 0 0 0 1px rgba(255,255,255,0.04);
  }
  .seg button {
    font-size: 12px; padding: 6px 12px; border-radius: 7px;
    color: #A1A1AA; font-weight: 500;
    transition: all 180ms ease;
  }
  .seg button[data-active="true"] {
    background: linear-gradient(135deg, #8B5CF6 0%, #6366F1 100%);
    color: #fff;
    box-shadow: 0 2px 6px -1px rgba(99,102,241,0.4);
  }

  /* Status bar dots */
  .signal-bar { background: #fff; }

  /* Progress bar fill */
  .progress-fill {
    background: linear-gradient(90deg, rgba(255,255,255,0.95), rgba(255,255,255,0.75));
    box-shadow: 0 0 12px rgba(255,255,255,0.4);
  }

  /* Bottom nav active glow */
  .nav-active-glow {
    background: radial-gradient(circle at 50% 100%, rgba(139,92,246,0.35) 0%, rgba(139,92,246,0) 70%);
  }
</style>
</head>
<body class="min-h-screen flex items-center justify-center p-6">

<div class="phone">
  <div class="screen">
    <div id="root" class="scroll"></div>
  </div>
</div>

<script type="text/babel" data-presets="react">
const { useState } = React;

/* ---------- ORIGINAL FLAT ICONS (Lucide-style, drawn original) ---------- */

const stroke = (color = "currentColor", w = 2) => ({
  fill: "none", stroke: color, strokeWidth: w,
  strokeLinecap: "round", strokeLinejoin: "round"
});

const Icon = {
  Star: ({ size = 16, color = "#F59E0B", fill = "#F59E0B" }) => (
    <svg width={size} height={size} viewBox="0 0 24 24">
      <path d="M12 3.2 L14.6 9.1 L21 9.8 L16.2 14.1 L17.6 20.3 L12 17.1 L6.4 20.3 L7.8 14.1 L3 9.8 L9.4 9.1 Z"
        fill={fill} stroke={color} strokeWidth="1.2" strokeLinejoin="round"/>
    </svg>
  ),
  Trophy: ({ size = 18, color = "#F59E0B" }) => (
    <svg width={size} height={size} viewBox="0 0 24 24" {...stroke(color, 1.8)}>
      <path d="M7 4h10v4a5 5 0 0 1-10 0V4Z"/>
      <path d="M7 6H4v2a3 3 0 0 0 3 3"/>
      <path d="M17 6h3v2a3 3 0 0 1-3 3"/>
      <path d="M10 14h4v3l1 3H9l1-3v-3Z"/>
    </svg>
  ),
  Sprout: ({ size = 30, color = "#F59E0B" }) => (
    <svg width={size} height={size} viewBox="0 0 24 24" {...stroke(color, 1.8)}>
      <path d="M12 20v-7"/>
      <path d="M12 13c0-3 2-5 6-5 0 4-2 6-6 6Z" fill={color} fillOpacity="0.18"/>
      <path d="M12 13c0-3-2-5-6-5 0 4 2 6 6 6Z" fill={color} fillOpacity="0.18"/>
    </svg>
  ),
  Sparkles: ({ size = 30, color = "#F59E0B" }) => (
    <svg width={size} height={size} viewBox="0 0 24 24" {...stroke(color, 1.8)}>
      <path d="M10 4l1.4 3.6L15 9l-3.6 1.4L10 14l-1.4-3.6L5 9l3.6-1.4L10 4Z" fill={color} fillOpacity="0.18"/>
      <path d="M17 13l.8 2.2L20 16l-2.2.8L17 19l-.8-2.2L14 16l2.2-.8L17 13Z" fill={color} fillOpacity="0.18"/>
    </svg>
  ),
  Target: ({ size = 30, color = "#A1A1AA" }) => (
    <svg width={size} height={size} viewBox="0 0 24 24" {...stroke(color, 1.8)}>
      <circle cx="12" cy="12" r="8"/>
      <circle cx="12" cy="12" r="4.5"/>
      <circle cx="12" cy="12" r="1.5" fill={color}/>
    </svg>
  ),
  Flame: ({ size = 30, color = "#A1A1AA" }) => (
    <svg width={size} height={size} viewBox="0 0 24 24" {...stroke(color, 1.8)}>
      <path d="M12 3c1 2.5 0 4-1 5.5C9.5 10.5 8 12 8 14.5a4 4 0 0 0 8 0c0-1.4-.5-2.4-1.2-3.4-1 1.4-2 1.7-2 .4 0-1.8 1-3.4-.8-8.5Z"/>
    </svg>
  ),
  Calendar: ({ size = 30, color = "#A1A1AA" }) => (
    <svg width={size} height={size} viewBox="0 0 24 24" {...stroke(color, 1.8)}>
      <rect x="4" y="5.5" width="16" height="14.5" rx="2.5"/>
      <path d="M8 3.5v4M16 3.5v4M4 10h16"/>
      <circle cx="12" cy="14.5" r="0.9" fill={color}/>
    </svg>
  ),
  TrophyBig: ({ size = 30, color = "#A1A1AA" }) => (
    <svg width={size} height={size} viewBox="0 0 24 24" {...stroke(color, 1.8)}>
      <path d="M7 4h10v4a5 5 0 0 1-10 0V4Z"/>
      <path d="M7 6H4v2a3 3 0 0 0 3 3"/>
      <path d="M17 6h3v2a3 3 0 0 1-3 3"/>
      <path d="M10 14h4v3l1 3H9l1-3v-3Z"/>
    </svg>
  ),
  Sun: ({ size = 30, color = "#F59E0B" }) => (
    <svg width={size} height={size} viewBox="0 0 24 24" {...stroke(color, 1.8)}>
      <circle cx="12" cy="12" r="4" fill={color} fillOpacity="0.18"/>
      <path d="M12 3v2M12 19v2M3 12h2M19 12h2M5.6 5.6l1.4 1.4M17 17l1.4 1.4M5.6 18.4l1.4-1.4M17 7l1.4-1.4"/>
    </svg>
  ),
  Gem: ({ size = 30, color = "#F59E0B" }) => (
    <svg width={size} height={size} viewBox="0 0 24 24" {...stroke(color, 1.8)}>
      <path d="M6 4h12l3 5-9 11L3 9l3-5Z" fill={color} fillOpacity="0.18"/>
      <path d="M3 9h18M9 4l-1 5 4 11M15 4l1 5-4 11"/>
    </svg>
  ),
  ChevronRight: ({ size = 18, color = "#52525B" }) => (
    <svg width={size} height={size} viewBox="0 0 24 24" {...stroke(color, 2)}>
      <path d="M9 6l6 6-6 6"/>
    </svg>
  ),
  ArrowRight: ({ size = 14, color = "#8B5CF6" }) => (
    <svg width={size} height={size} viewBox="0 0 24 24" {...stroke(color, 2)}>
      <path d="M5 12h14M13 6l6 6-6 6"/>
    </svg>
  ),
  /* Bottom nav (original simple glyphs) */
  NavHome: ({ size = 22, color = "#52525B" }) => (
    <svg width={size} height={size} viewBox="0 0 24 24" {...stroke(color, 1.8)}>
      <path d="M4 11l8-7 8 7v9a1 1 0 0 1-1 1h-4v-6h-6v6H5a1 1 0 0 1-1-1v-9Z"/>
    </svg>
  ),
  NavCheck: ({ size = 22, color = "#52525B" }) => (
    <svg width={size} height={size} viewBox="0 0 24 24" {...stroke(color, 1.8)}>
      <rect x="4" y="4" width="16" height="16" rx="4"/>
      <path d="M8 12.5l3 3 5-6"/>
    </svg>
  ),
  NavChart: ({ size = 22, color = "#52525B" }) => (
    <svg width={size} height={size} viewBox="0 0 24 24" {...stroke(color, 1.8)}>
      <path d="M4 20h16"/>
      <path d="M7 16v-5M12 16V8M17 16v-3"/>
    </svg>
  ),
  NavSettings: ({ size = 22, color = "#52525B" }) => (
    <svg width={size} height={size} viewBox="0 0 24 24" {...stroke(color, 1.8)}>
      <circle cx="12" cy="12" r="3"/>
      <path d="M12 3v2M12 19v2M3 12h2M19 12h2M5.6 5.6l1.4 1.4M17 17l1.4 1.4M5.6 18.4l1.4-1.4M17 7l1.4-1.4"/>
    </svg>
  ),
  NavUser: ({ size = 22, color = "#8B5CF6", fill = false }) => (
    <svg width={size} height={size} viewBox="0 0 24 24" {...stroke(color, 1.8)}>
      <circle cx="12" cy="8.5" r="3.6" fill={fill ? color : "none"} fillOpacity={fill ? 0.18 : 1}/>
      <path d="M5 20c.6-3.7 3.6-6 7-6s6.4 2.3 7 6"
        fill={fill ? color : "none"} fillOpacity={fill ? 0.18 : 1}/>
    </svg>
  ),
};

/* ---------- STATUS BAR + APP HEADER ---------- */

function StatusBar() {
  return (
    <div className="relative h-[54px] flex items-center justify-between px-7 pt-3 text-[15px] font-semibold tnum">
      <span>9:41</span>
      <span className="absolute left-1/2 -translate-x-1/2 w-[130px] h-[34px]"/>
      <div className="flex items-center gap-1.5">
        {/* signal */}
        <div className="flex items-end gap-[2px] h-3">
          <span className="signal-bar w-[3px] h-[4px] rounded-[1px]"/>
          <span className="signal-bar w-[3px] h-[6px] rounded-[1px]"/>
          <span className="signal-bar w-[3px] h-[9px] rounded-[1px]"/>
          <span className="signal-bar w-[3px] h-[11px] rounded-[1px]"/>
        </div>
        {/* wifi */}
        <svg width="16" height="12" viewBox="0 0 16 12"><path d="M1 4c4-3 10-3 14 0M3.5 6.5c2.5-2 6.5-2 9 0M6 9c1-1 3-1 4 0" fill="none" stroke="#fff" strokeWidth="1.6" strokeLinecap="round"/></svg>
        {/* battery */}
        <div className="relative w-[25px] h-[12px] rounded-[3px]" style={{boxShadow: "inset 0 0 0 1px rgba(255,255,255,0.5)"}}>
          <div className="absolute top-[2px] left-[2px] bottom-[2px] w-[16px] rounded-[1px] bg-white"/>
          <div className="absolute -right-[2.5px] top-[3.5px] w-[1.5px] h-[5px] bg-white/60 rounded-r"/>
        </div>
      </div>
    </div>
  );
}

function MiniAppHeader() {
  return (
    <div className="px-4 pb-3 pt-1 flex items-center justify-between">
      <div className="flex items-center gap-2">
        <button className="w-8 h-8 rounded-full flex items-center justify-center tap" style={{background:"#1A1A24"}}>
          <svg width="14" height="14" viewBox="0 0 24 24" {...stroke("#fff", 2)}><path d="M15 6l-6 6 6 6"/></svg>
        </button>
        <div className="leading-tight">
          <div className="text-[13px] font-semibold text-white">Habitrack</div>
          <div className="text-[11px] text-[#71717A]">Отслеживание привычек</div>
        </div>
      </div>
      <button className="w-8 h-8 rounded-full flex items-center justify-center tap" style={{background:"#1A1A24"}}>
        <svg width="16" height="16" viewBox="0 0 24 24" {...stroke("#A1A1AA", 2)}>
          <circle cx="5" cy="12" r="1.4" fill="#A1A1AA"/>
          <circle cx="12" cy="12" r="1.4" fill="#A1A1AA"/>
          <circle cx="19" cy="12" r="1.4" fill="#A1A1AA"/>
        </svg>
      </button>
    </div>
  );
}

/* ---------- HERO ---------- */

function Hero() {
  return (
    <div className="relative rounded-[20px] hero-glow overflow-hidden" style={{padding:"22px"}}>
      {/* decorative orbs */}
      <div className="absolute -right-10 -top-10 w-40 h-40 rounded-full" style={{background:"radial-gradient(circle, rgba(255,255,255,0.25), rgba(255,255,255,0) 70%)"}}/>
      <div className="absolute -left-12 -bottom-12 w-44 h-44 rounded-full" style={{background:"radial-gradient(circle, rgba(0,0,0,0.25), rgba(0,0,0,0) 70%)"}}/>

      <div className="relative flex items-center gap-4">
        <div className="w-16 h-16 rounded-full flex items-center justify-center text-[28px] font-bold text-white"
          style={{background:"rgba(255,255,255,0.22)", boxShadow:"inset 0 0 0 1px rgba(255,255,255,0.25), 0 8px 18px -8px rgba(0,0,0,0.4)"}}>
          S
        </div>
        <div className="flex-1 min-w-0">
          <div className="text-[22px] font-semibold text-white leading-tight">Saint</div>
          <div className="text-[13px] text-white/75 leading-tight mt-0.5">@sa11nttt</div>
        </div>
      </div>

      <div className="relative mt-4 flex items-center gap-2">
        <Icon.Star size={16} color="#FCD34D" fill="#FCD34D"/>
        <span className="text-[15px] font-medium text-white">Уровень 2</span>
        <span className="flex-1"/>
        <span className="tnum text-[15px] font-bold text-white">175 XP</span>
      </div>

      <div className="relative mt-3 flex items-center justify-between text-[12px]">
        <span className="text-white/70">До следующего уровня</span>
        <span className="tnum text-white/90 font-medium">75 / 300</span>
      </div>

      <div className="relative mt-2 h-[6px] rounded-full overflow-hidden" style={{background:"rgba(255,255,255,0.22)"}}>
        <div className="progress-fill h-full rounded-full" style={{width:"25%"}}/>
      </div>
    </div>
  );
}

/* ---------- ACHIEVEMENTS ---------- */

const TILES = [
  { name: "Первый шаг",      xp: 10,   unlocked: true,  Icon: Icon.Sprout },
  { name: "Поехали!",        xp: 10,   unlocked: true,  Icon: Icon.Sparkles },
  { name: "Тройка",          xp: 25,   unlocked: false, Icon: Icon.Target },
  { name: "Неделя",          xp: 50,   unlocked: false, Icon: Icon.Flame },
  { name: "Месяц!",          xp: 200,  unlocked: false, Icon: Icon.Calendar },
  { name: "Сотка",           xp: 1000, unlocked: false, Icon: Icon.TrophyBig },
  { name: "Идеальный день",  xp: 30,   unlocked: true,  Icon: Icon.Sun },
  { name: "Идеальная неделя",xp: 100,  unlocked: true,  Icon: Icon.Gem },
];

function AchievementTile({ name, xp, unlocked, Icon: I }) {
  return (
    <div
      className={`tap rounded-[14px] flex flex-col items-center justify-center text-center px-2.5 ${unlocked ? "ach-unlocked" : "ach-locked"}`}
      style={{height: "96px"}}
    >
      <div className="mb-1.5" style={{opacity: unlocked ? 1 : 0.32}}>
        <I size={30} color={unlocked ? "#F59E0B" : "#A1A1AA"} />
      </div>
      <div className={`leading-tight ${unlocked ? "text-white text-[12px] font-medium" : "text-[#A1A1AA] text-[11px] font-medium"}`}>
        {name}
      </div>
      <div className={`mt-0.5 tnum ${unlocked ? "text-[#F59E0B] text-[11px] font-semibold" : "text-[#52525B] text-[10px] font-medium"}`}>
        +{xp} XP
      </div>
    </div>
  );
}

function Achievements() {
  return (
    <div className="rounded-[20px]" style={{background:"#1A1A24", padding:"18px"}}>
      <div className="flex items-center gap-2 mb-3.5">
        <div className="w-[28px] h-[28px] rounded-lg flex items-center justify-center" style={{background:"rgba(245,158,11,0.14)"}}>
          <Icon.Trophy size={16} color="#F59E0B"/>
        </div>
        <div className="text-[18px] font-semibold text-white">Достижения</div>
        <div className="flex-1"/>
        <div className="text-[12px] font-semibold tnum px-2 py-1 rounded-md" style={{color:"#F59E0B", background:"rgba(245,158,11,0.10)"}}>
          5 / 20
        </div>
      </div>

      <div className="grid grid-cols-3" style={{gap:"10px"}}>
        {TILES.map((t, i) => <AchievementTile key={i} {...t} />)}
      </div>

      <div className="mt-4 flex justify-end">
        <button className="text-[13px] font-semibold flex items-center gap-1.5 tap" style={{color:"#8B5CF6"}}>
          Все 20
          <Icon.ArrowRight size={14} color="#8B5CF6"/>
        </button>
      </div>
    </div>
  );
}

/* ---------- SETTINGS ---------- */

function SettingsRow({ label, value, right, last }) {
  return (
    <div className={`row-tap tap flex items-center justify-between rounded-[12px] ${last ? "" : ""}`} style={{padding:"14px 16px"}}>
      <div className="text-[14px] text-[#A1A1AA]">{label}</div>
      {right
        ? right
        : (
          <div className="flex items-center gap-1.5">
            <div className="text-[14px] text-white font-medium">{value}</div>
            <Icon.ChevronRight size={16} color="#52525B"/>
          </div>
        )
      }
    </div>
  );
}

function Settings() {
  const [theme, setTheme] = useState("dark");
  const [notif, setNotif] = useState(true);
  return (
    <div>
      <div className="text-[18px] font-semibold text-white mb-3 px-1">Настройки</div>
      <div className="rounded-[20px]" style={{background:"#1A1A24", padding:"4px"}}>
        <SettingsRow label="Имя" value="Saint"/>
        <div className="hairline mx-4"/>
        <SettingsRow label="Username" value="@sa11nttt"/>
        <div className="hairline mx-4"/>
        <SettingsRow label="Часовой пояс" value="Europe/Moscow"/>
        <div className="hairline mx-4"/>
        <SettingsRow label="Тема" right={
          <div className="seg">
            <button data-active={theme==="dark"} onClick={()=>setTheme("dark")}>Тёмная</button>
            <button data-active={theme==="light"} onClick={()=>setTheme("light")}>Светлая</button>
          </div>
        }/>
        <div className="hairline mx-4"/>
        <SettingsRow label="Уведомления" right={
          <div className="ios-switch" data-on={notif} onClick={()=>setNotif(v=>!v)}>
            <div className="knob"/>
          </div>
        }/>
      </div>
    </div>
  );
}

/* ---------- INFO + FOOTER ---------- */

function Info() {
  return (
    <div className="rounded-[14px] flex flex-col gap-1" style={{background:"#252535", padding:"12px 14px"}}>
      <div className="text-[12px] text-[#A1A1AA] flex items-center justify-between">
        <span>Внутри Telegram</span>
        <span className="text-white font-medium flex items-center gap-1.5">
          <span className="w-1.5 h-1.5 rounded-full" style={{background:"#10B981", boxShadow:"0 0 8px rgba(16,185,129,0.6)"}}/>
          да
        </span>
      </div>
      <div className="text-[12px] text-[#A1A1AA] flex items-center justify-between">
        <span>Версия</span>
        <span className="text-white font-medium tnum">1.0</span>
      </div>
    </div>
  );
}

function Footer() {
  return (
    <div className="text-center text-[11px] text-[#52525B] pb-1">@my_hab1ts_tracker_bot</div>
  );
}

/* ---------- BOTTOM NAV ---------- */

function BottomNav() {
  const items = [
    { key: "home",     Icon: Icon.NavHome,     label: "Сегодня" },
    { key: "habits",   Icon: Icon.NavCheck,    label: "Привычки" },
    { key: "stats",    Icon: Icon.NavChart,    label: "Статистика" },
    { key: "settings", Icon: Icon.NavSettings, label: "Ещё" },
    { key: "profile",  Icon: Icon.NavUser,     label: "Профиль", active: true },
  ];
  return (
    <div className="absolute left-0 right-0 bottom-0 z-20" style={{background:"linear-gradient(180deg, rgba(10,10,15,0) 0%, rgba(10,10,15,0.92) 30%, rgba(10,10,15,1) 60%)", paddingTop:"22px"}}>
      <div className="mx-3 mb-3 rounded-[22px] flex items-end justify-around relative overflow-hidden"
        style={{background:"#13131B", padding:"10px 8px 14px", boxShadow:"inset 0 0 0 1px rgba(255,255,255,0.04)"}}>
        {items.map(it => (
          <button key={it.key} className="relative flex-1 flex flex-col items-center gap-1 tap py-1">
            {it.active && <div className="absolute -top-[10px] left-1/2 -translate-x-1/2 w-20 h-10 nav-active-glow rounded-full pointer-events-none"/>}
            <it.Icon color={it.active ? "#8B5CF6" : "#52525B"} fill={it.active}/>
            <span className="text-[10px] font-medium" style={{color: it.active ? "#fff" : "#52525B"}}>{it.label}</span>
            {it.active && <div className="w-1 h-1 rounded-full mt-0.5" style={{background:"#8B5CF6", boxShadow:"0 0 8px #8B5CF6"}}/>}
          </button>
        ))}
      </div>
      {/* home indicator */}
      <div className="flex justify-center pb-2">
        <div className="w-[130px] h-[5px] rounded-full bg-white/40"/>
      </div>
    </div>
  );
}

/* ---------- PAGE ---------- */

function App() {
  return (
    <div className="min-h-full" style={{paddingBottom:"140px"}}>
      <StatusBar/>
      <MiniAppHeader/>

      <div className="px-4">
        <h1 className="text-[26px] font-semibold text-white mb-4 mt-1">Профиль</h1>

        <div className="flex flex-col" style={{gap:"18px"}}>
          <Hero/>
          <Achievements/>
          <Settings/>
          <Info/>
          <Footer/>
        </div>
      </div>

      <BottomNav/>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
