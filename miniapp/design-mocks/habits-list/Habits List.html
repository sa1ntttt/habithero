<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <title>HabitHero — Привычки</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    html, body { margin: 0; padding: 0; background: #06060A; min-height: 100vh; }
    body {
      display: flex; align-items: center; justify-content: center;
      padding: 40px 20px;
      box-sizing: border-box;
      font-family: -apple-system, "SF Pro Text", system-ui, sans-serif;
    }
    /* faint ambient backdrop so the device pops */
    body::before {
      content: '';
      position: fixed; inset: 0;
      background:
        radial-gradient(800px 600px at 30% 20%, rgba(139,92,246,0.10), transparent 60%),
        radial-gradient(700px 500px at 70% 80%, rgba(99,102,241,0.08), transparent 60%);
      pointer-events: none;
    }
    #root { position: relative; z-index: 1; }
  </style>
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
</head>
<body>
  <div id="root"></div>
  <script type="text/babel" src="icons.jsx"></script>
  <script type="text/babel" src="habits-screen.jsx"></script>
  <script type="text/babel">
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<HabitsScreen />);
  </script>
</body>
</html>
