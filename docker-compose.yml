services:
  postgres:
    image: postgres:15-alpine
    container_name: habitbot_postgres
    environment:
      POSTGRES_USER: habituser
      POSTGRES_PASSWORD: habitpass
      POSTGRES_DB: habitdb
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U habituser -d habitdb"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
