[project]
name = "habit-bot-backend"
version = "0.1.0"
description = "HabitHero Telegram bot backend"
requires-python = ">=3.11"
dependencies = [
    "aiogram>=3.13",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy>=2.0",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "apscheduler>=3.10",
    "pydantic-settings>=2.6",
    "structlog>=24.4",
    "matplotlib>=3.9",
    "google-genai>=1.0",
    "python-dotenv>=1.0",
    "pytz>=2024.1",
    "aiohttp>=3.11",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.hatch.build.targets.wheel]
packages = ["src"]
